services:
  - type: web
    name: lendwise-loan-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python train_model.py && python manage.py migrate --noinput && python manage.py collectstatic --noinput
    startCommand: gunicorn loan_app.wsgi:application
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"