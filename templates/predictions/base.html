{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Lendwise{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <link rel="stylesheet" href="{% static 'css/quick-fill.css' %}">
</head>
<body>
  <header class="topbar"><a class="brand" href="{% url 'dashboard' %}"><span class="brand-mark">L</span><span>Lendwise</span></a><nav><a href="{% url 'dashboard' %}">Overview</a><a class="nav-cta" href="{% url 'predict' %}">New assessment <span>→</span></a></nav></header>
  <main>{% block content %}{% endblock %}</main>
  <footer>Loan approval intelligence for faster, clearer decisions.</footer>
  <script src="{% static 'js/app.js' %}"></script>
</body>
</html>
